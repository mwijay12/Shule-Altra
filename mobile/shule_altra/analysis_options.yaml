# Analysis for the mobile pilot.
#
# This file is the gate: `flutter analyze` in CI fails the job on any warning
# here, because a Flutter app that merely compiles is not evidence that it works.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Anything that would ship a broken screen is an error, not a hint.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    invalid_use_of_protected_member: error
    missing_required_param: error
    missing_return: error
    # Prefer a build failure over an assertion in release mode.
    avoid_print: error

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_unnecessary_containers
    - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - empty_catches
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - sized_box_for_whitespace
    - sort_child_properties_last
    - use_build_context_synchronously
    - use_colored_box
    - use_full_hex_values_for_flutter_colors
    - use_key_in_widget_constructors
