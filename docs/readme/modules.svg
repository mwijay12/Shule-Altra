<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">A snapshot of twelve core modules</title><desc id="desc">Four groups each show three selected modules: learning, operations, resources and administration. This is a feature map, not a performance chart.</desc>
<defs><style>.bar{animation:reveal 1.4s ease-out both;transform-origin:left}.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}@keyframes reveal{from{transform:scaleX(.08);opacity:.3}to{transform:scaleX(1);opacity:1}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style></defs>
<rect width="1200" height="280" rx="24" fill="#0d2030"/><text x="42" y="48" fill="#effaf7" font-family="Arial,sans-serif" font-size="22" font-weight="bold">THE SCHOOL TOOLKIT</text><text x="42" y="72" fill="#8fb5af" font-family="Arial,sans-serif" font-size="13">12 selected modules · 4 groups · feature map, not usage data</text>
<g font-family="Arial,sans-serif" font-size="14" fill="#d9eee8"><text x="42" y="112">Learning</text><text x="42" y="154">Operations</text><text x="42" y="196">Resources</text><text x="42" y="238">Administration</text></g>
<g fill="#183a42"><rect x="185" y="96" width="260" height="19" rx="9"/><rect x="185" y="138" width="260" height="19" rx="9"/><rect x="185" y="180" width="260" height="19" rx="9"/><rect x="185" y="222" width="260" height="19" rx="9"/></g>
<g fill="#62dfb5"><rect class="bar" x="185" y="96" width="260" height="19" rx="9"/><rect class="bar b2" x="185" y="138" width="260" height="19" rx="9"/><rect class="bar b3" x="185" y="180" width="260" height="19" rx="9"/><rect class="bar b4" x="185" y="222" width="260" height="19" rx="9"/></g>
<g fill="#aecdc4" font-family="Arial,sans-serif" font-size="14"><text x="466" y="111">Students · Academics · Attendance</text><text x="466" y="153">Finance · Canteen · Inventory</text><text x="466" y="195">Hostel · Transport · Timetable</text><text x="466" y="237">Staff · Reports · Settings</text></g>
</svg>
