<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Shule Altra — built for schools, made in Tanzania</title><desc id="desc">An illustrated school dashboard with animated orbiting dots and a softly pulsing chart.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09182b"/><stop offset="1" stop-color="#102d40"/></linearGradient><linearGradient id="accent"><stop stop-color="#53e0ba"/><stop offset="1" stop-color="#a2efb5"/></linearGradient><style>
.orbit {transform-origin: 1010px 190px; animation: orbit 24s linear infinite}.pulse {transform-origin: 962px 277px; animation: pulse 4s ease-in-out infinite}.dot {animation: fade 3s ease-in-out infinite alternate}@keyframes orbit {to {transform:rotate(360deg)}}@keyframes pulse {50% {opacity:.62}}@keyframes fade {to {opacity:.35}}@media (prefers-reduced-motion:reduce){.orbit,.pulse,.dot{animation:none}}
</style></defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/><circle cx="1130" cy="30" r="200" fill="#39d4aa" opacity=".06"/><circle cx="100" cy="380" r="220" fill="#3f8eff" opacity=".05"/>
<rect x="64" y="52" width="147" height="29" rx="14.5" fill="#1e564f"/><text x="83" y="72" fill="#a2f1d3" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="2">ALTRAWARE / TZ</text>
<text x="64" y="152" fill="#f4fbf8" font-family="Arial,sans-serif" font-size="68" font-weight="bold" letter-spacing="-2">Shule Altra<tspan fill="#69e1b9">.</tspan></text>
<text x="67" y="201" fill="#b5cfc9" font-family="Arial,sans-serif" font-size="21">A clearer day for every school.</text>
<text x="67" y="233" fill="#81a9a4" font-family="Arial,sans-serif" font-size="16">Students  /  academics  /  attendance  /  finance</text>
<rect x="66" y="281" width="186" height="40" rx="20" fill="url(#accent)"/><text x="91" y="306" fill="#102d2a" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1">BUILT IN TANZANIA</text>
<g class="orbit"><circle cx="1010" cy="190" r="152" fill="none" stroke="#73dfba" stroke-opacity=".16"/><circle cx="1010" cy="38" r="5" fill="#82f5c7"/><circle cx="1153" cy="242" r="3" fill="#82f5c7"/></g>
<rect x="728" y="58" width="355" height="269" rx="18" fill="#132d3c" stroke="#34575c"/><rect x="749" y="79" width="74" height="7" rx="3" fill="#5ee1b3"/><circle cx="1048" cy="82" r="6" fill="#5ee1b3" class="dot"/>
<text x="749" y="121" fill="#d6f3e9" font-family="Arial,sans-serif" font-size="15" font-weight="bold">School overview</text><text x="749" y="145" fill="#83a9a5" font-family="Arial,sans-serif" font-size="11">A connected view of your day</text>
<rect x="749" y="164" width="91" height="57" rx="9" fill="#1d4048"/><rect x="850" y="164" width="91" height="57" rx="9" fill="#1d4048"/><rect x="951" y="164" width="110" height="57" rx="9" fill="#1d4048"/>
<text x="760" y="187" fill="#99bdb6" font-family="Arial,sans-serif" font-size="10">LEARNERS</text><text x="760" y="207" fill="#e4faf2" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Records</text><text x="861" y="187" fill="#99bdb6" font-family="Arial,sans-serif" font-size="10">PRESENCE</text><text x="861" y="207" fill="#e4faf2" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Register</text><text x="962" y="187" fill="#99bdb6" font-family="Arial,sans-serif" font-size="10">ACADEMICS</text><text x="962" y="207" fill="#e4faf2" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Progress</text>
