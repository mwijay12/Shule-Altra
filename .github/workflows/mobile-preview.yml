name: Mobile pilot

# What this workflow is: the only place the Flutter app is actually compiled.
# The authoring environment had no Flutter or Android SDK, so nothing here is a
# claim — each step either passes or fails in this run.
#
# Gates, in order:
#   1. analyze  — any warning is a failure (`analysis_options.yaml` promotes the
#                 lint set that would otherwise ship a broken screen).
#   2. test     — contrast, mapping, session and widget tests.
#   3. build    — debug and arm64 release-mode APKs signed with temporary debug keys, for testing only.

on:
  pull_request:
    paths:
      - 'mobile/shule_altra/**'
      - '.github/workflows/mobile-preview.yml'
  push:
    paths:
      - 'mobile/shule_altra/**'
      - '.github/workflows/mobile-preview.yml'
  workflow_dispatch:

permissions:
  # `contents: write` is only used by the release step at the bottom of this file,
  # and only on a branch push. The artifact CDN is not reachable from every
  # network, so the APK is also published as a release asset that a phone can
  # download with one tap.
  contents: write

concurrency:
  group: mobile-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/shule_altra
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
          pub-cache: true

      # Generate the platform project into a temporary directory first, so
      # Flutter cannot overwrite the Dart, tests, README or pubspec authored here.
      - name: Generate temporary Android scaffold
        run: |
          flutter create --platforms android --project-name shule_altra_mobile --org com.shulealtra "$RUNNER_TEMP/shule_mobile"
          cp -R "$RUNNER_TEMP/shule_mobile/android" ./android
          python3 -m unittest discover -s tool -p "test_*.py"
          python3 tool/configure_android.py

      # One demo credential, two products. The generated Dart must match
      # config/demo-account.json, or the app and the website would hand out
      # different passwords and this build would be the one that lies.
      - name: Check the demo account is in step with the website
        run: |
          python3 tool/sync_demo_account.py
          if ! git diff --quiet -- lib/data/demo_account.g.dart; then
            git diff -- lib/data/demo_account.g.dart
            echo "::error::lib/data/demo_account.g.dart is stale. Run python3 tool/sync_demo_account.py and commit the result."
            exit 1
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: |
          if ! flutter analyze --no-pub > "$RUNNER_TEMP/flutter-analyze.log" 2>&1; then
            cat "$RUNNER_TEMP/flutter-analyze.log"
            while IFS= read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/flutter-analyze.log"
            exit 1
          fi

      - name: Test
        run: |
          set +e
          flutter test --no-pub --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          status=$?
          tail -n 30 "$RUNNER_TEMP/flutter-test.log"
          if [ "$status" -ne 0 ]; then
            RUNNER_TEMP="$RUNNER_TEMP" python3 tool/report_test_failure.py
            exit 1
          fi

      - name: Test preview with demo credential disabled
        run: flutter test --no-pub --dart-define=DISABLE_DEMO_SIGN_IN=true test/demo_disabled_test.dart

      - name: Build debug APK (prototype only)
        run: |
          if ! flutter build apk --debug > "$RUNNER_TEMP/flutter-build.log" 2>&1; then
            cat "$RUNNER_TEMP/flutter-build.log"
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"], "flutter-build.log"); s=open(p).read(); s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::" + s[-25000:])'
            exit 1
          fi

      # A universal debug APK carries all three ABIs, which is a slow download on
      # a phone. The phone gets the arm64 split of the same code — every Android
      # phone is arm64 — and the universal APK stays
      # available as the workflow artifact for anything else.
      - name: Build a phone-sized APK (per-ABI split)
        run: |
          flutter build apk --debug --split-per-abi
          # A release build is AOT-compiled, an order of magnitude smaller and
          # opens far faster than debug. It is signed with the throwaway debug key
          # because this pilot has no release keystore, which makes it fine to
          # install and look at and unfit to distribute.
          flutter build apk --release --split-per-abi

      - name: Upload debug prototype
        uses: actions/upload-artifact@v4
        with:
          name: shule-altra-prototype-debug-apk
          path: mobile/shule_altra/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Publish the smaller phone APK as a workflow artifact on every branch.
      # These builds are not configured for a real school and use ephemeral
      # debug signing, so they cannot provide a stable upgrade or production identity.
      - name: Prepare phone preview and checksums
        run: |
          set -eu
          out="${RUNNER_TEMP}/phone-preview"
          mkdir -p "$out"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$out/shule-altra-arm64-preview.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "$out/shule-altra-arm64-debug.apk"
          cd "$out"
          sha256sum shule-altra-arm64-preview.apk shule-altra-arm64-debug.apk > SHA256SUMS.txt
          printf 'Commit: %s\nWorkflow run: %s\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD-INFO.txt
          printf '%s\n' \
            'arm64-preview: release-mode APK signed with an ephemeral debug key.' \
            'arm64-debug: debug APK signed with an ephemeral debug key.' \
            'No school Firebase dart-defines are supplied in this CI build.' \
            'For fictional sample testing only; not production-signed.' \
            'Use the universal debug artifact if the device is not arm64.' >> BUILD-INFO.txt

      - name: Upload phone preview
        uses: actions/upload-artifact@v4
        with:
          name: shule-altra-phone-preview-arm64
          path: ${{ runner.temp }}/phone-preview/
          if-no-files-found: error
          retention-days: 7

      # A phone that is not signed in to GitHub cannot download a workflow
      # artifact; it can download a release asset. This publishes the same APK
      # under a rolling tag on the branch that built it, and says in the release
      # notes exactly what the build is and what the demo credential opens.
      #
      # Paths here are relative to `mobile/shule_altra` (the job's working
      # directory), not the repository root.
      - name: Publish the APK as a release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA:0:7}"
          out="build/app/outputs/flutter-apk"
          app="${RUNNER_TEMP}/shule-altra-${short}-arm64.apk"
          debug="${RUNNER_TEMP}/shule-altra-${short}-arm64-debug.apk"
          log="${RUNNER_TEMP}/release.log"
          cp "$out/app-arm64-v8a-release.apk" "$app"
          cp "$out/app-arm64-v8a-debug.apk" "$debug"
          # The step log is not readable from every network; a notice is.
          echo "::notice::arm64 APK is $(( $(stat -c%s "$app") / 1048576 )) MB release, $(( $(stat -c%s "$debug") / 1048576 )) MB debug"
          notes="$(cat <<EOF
          The Shule Altra mobile pilot, built from \`${short}\` on \`${GITHUB_REF_NAME}\`.

          Download \`shule-altra-${short}-arm64.apk\` — arm64, release build, signed with
          a throwaway debug key. \`shule-altra-${short}-arm64-debug.apk\` is the same app
          in debug mode, for a logcat session; it is several times larger and slower.

          **Demo sign-in.** Open the app → *Continue* twice → *Explore the sample preview* → *Learners* → *Fill the demo credential* → *Sign in to the demo*.

          The current demo credential is printed in the app and can be filled in
          using the button on that form. It is defined by config/demo-account.json.

          That credential opens six fictional learners held on the phone. It is not a
          school account, it stores nothing, and it cannot read a real register — the
          live path refuses it in code. This is a preview build, not a release: it is
          signed with a throwaway key and there is no update path from it.
          EOF
          )"
          # The rolling main tag is updated only by main pushes.
          {
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$app" "$debug" \
              --title "Shule Altra mobile pilot — ${short}" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          } > "$log" 2>&1 || {
            # The step log is not readable from every network, so the reason is
            # repeated as an annotation, which is.
            while IFS= read -r line; do
              echo "::error::${line//\%/%25}"
            done < <(tail -n 12 "$log")
            exit 1
          }
          echo "Published $tag"
