name: Mobile pilot

# What this workflow is: the only place the Flutter app is actually compiled.
# The authoring environment had no Flutter or Android SDK, so nothing here is a
# claim — each step either passes or fails in this run.
#
# Gates, in order:
#   1. analyze  — any warning is a failure (`analysis_options.yaml` promotes the
#                 lint set that would otherwise ship a broken screen).
#   2. test     — contrast, mapping, session and widget tests.
#   3. build    — a debug APK, unsigned and not for release.

on:
  pull_request:
    paths:
      - 'mobile/shule_altra/**'
      - '.github/workflows/mobile-preview.yml'
  push:
    paths:
      - 'mobile/shule_altra/**'
      - '.github/workflows/mobile-preview.yml'
  workflow_dispatch:

permissions:
  # `contents: write` is only used by the release step at the bottom of this file,
  # and only on a branch push. The artifact CDN is not reachable from every
  # network, so the APK is also published as a release asset that a phone can
  # download with one tap.
  contents: write

concurrency:
  group: mobile-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/shule_altra
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
          pub-cache: true

      # Generate the platform project into a temporary directory first, so
      # Flutter cannot overwrite the Dart, tests, README or pubspec authored here.
      - name: Generate temporary Android scaffold
        run: |
          flutter create --platforms android --project-name shule_altra_mobile --org com.shulealtra "$RUNNER_TEMP/shule_mobile"
          cp -R "$RUNNER_TEMP/shule_mobile/android" ./android
          python3 -m unittest discover -s tool -p "test_*.py"
          python3 tool/configure_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: |
          if ! flutter analyze --no-pub > "$RUNNER_TEMP/flutter-analyze.log" 2>&1; then
            cat "$RUNNER_TEMP/flutter-analyze.log"
            while IFS= read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/flutter-analyze.log"
            exit 1
          fi

      - name: Test
        run: |
          set +e
          flutter test --no-pub --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          status=$?
          tail -n 30 "$RUNNER_TEMP/flutter-test.log"
          if [ "$status" -ne 0 ]; then
            RUNNER_TEMP="$RUNNER_TEMP" python3 tool/report_test_failure.py
            exit 1
          fi

      - name: Build debug APK (prototype only)
        run: |
          if ! flutter build apk --debug > "$RUNNER_TEMP/flutter-build.log" 2>&1; then
            cat "$RUNNER_TEMP/flutter-build.log"
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"], "flutter-build.log"); s=open(p).read(); s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::" + s[-25000:])'
            exit 1
          fi

      # A universal debug APK carries all three ABIs, which is roughly 190 MB to
      # download on a phone. The phone gets an arm64-only build of the same code;
      # every Android phone made since about 2015 is arm64, and the universal APK
      # stays available as the workflow artifact for anything else.
      - name: Build a phone-sized APK (arm64 only)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload debug prototype
        uses: actions/upload-artifact@v4
        with:
          name: shule-altra-prototype-debug-apk
          path: mobile/shule_altra/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # A phone that is not signed in to GitHub cannot download a workflow
      # artifact; it can download a release asset. This publishes the same APK
      # under a rolling tag on the branch that built it, and says in the release
      # notes exactly what the build is and what the demo credential opens.
      #
      # Paths here are relative to `mobile/shule_altra` (the job's working
      # directory), not the repository root.
      - name: Publish the APK as a release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA:0:7}"
          built="build/app/outputs/flutter-apk/app-debug.apk"
          release="${RUNNER_TEMP}/shule-altra-${short}-debug.apk"
          log="${RUNNER_TEMP}/release.log"
          cp "$built" "$release"
          notes="$(cat <<EOF
          Debug build of the Shule Altra mobile pilot, from \`${short}\` on \`${GITHUB_REF_NAME}\`.

          **Demo sign-in.** Open the app → *Continue* twice → *Explore the sample preview* → *Learners* → *Fill the demo credential* → *Sign in to the demo*.

          - Email: \`demo@shule.test\`
          - Password: \`shule-demo\`

          That credential opens six fictional learners held on the phone. It is not a
          school account, it stores nothing, and it cannot read a real register — the
          live path refuses it in code. This is a debug APK, unsigned for release.
          EOF
          )"
          # The tag is rolling: one tag per branch, so old builds do not pile up and
          # the newest link always works.
          {
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" "$release" \
              --title "Shule Altra mobile pilot — ${short}" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --prerelease
          } > "$log" 2>&1 || {
            # The step log is not readable from every network, so the reason is
            # repeated as an annotation, which is.
            while IFS= read -r line; do
              echo "::error::${line//\%/%25}"
            done < <(tail -n 12 "$log")
            exit 1
          }
          echo "Published $tag"
