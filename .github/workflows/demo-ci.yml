name: Demo CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Data-layer smoke
        run: npm run demo:smoke:data
      - name: Dashboard route visibility
        run: npm run demo:smoke:route-visibility
      - name: Attendance filters and scroll
        run: npm run demo:smoke:attendance-filters
      - name: Student details interaction
        run: npm run demo:smoke:student-details
      - name: Assessment report safeguards
        run: npm run demo:smoke:assessment-report
      - name: Supplier and sidebar interaction
        run: npm run demo:smoke:supplier-sidebar-ui
      - name: Sidebar preferences
        run: npm run demo:smoke:sidebar-preferences
      - name: Supplier register
        run: npm run demo:smoke:suppliers
      - name: Expense register
        run: npm run demo:smoke:expense-register
      - name: Staff duties
        run: npm run demo:smoke:staff-duties
      - name: Correct duplicate grades
        run: npm run demo:smoke:resolve-duplicate
      - name: Review duplicate grades
        run: npm run demo:smoke:grade-review
      - name: Timetable editing and clash checks
        run: npm run demo:smoke:timetable-editor
      - name: Timetable editor interaction
        run: npm run demo:smoke:timetable-ui
      - name: Timetable and ID integrity
        run: npm run demo:smoke:integrity
      - name: O-level consistency
        run: npm run demo:smoke:olevel
      - name: Frame budget (animation must be visible)
        run: npm run demo:smoke:perf
      - name: Motion spec (tokens, GPU-only, chart choreography)
        run: npm run demo:smoke:motionspec
      - name: Dashboard loading screen
        run: npm run demo:smoke:loader
      - name: Motion and reduced-motion
        run: npm run demo:smoke:motion
      - name: Landing palette (follows the school theme)
        run: npm run demo:smoke:landingtheme
      - name: Landing content
        run: npm run demo:smoke:landing
      - name: Copy guard
        run: npm run demo:smoke:copy
      - name: Theme sync and local demo safety
        run: npm run demo:smoke:theme-sync
      - name: Theme colours on generated printouts
        run: npm run demo:smoke:print-themes
      - name: Brand, theme and contrast
        run: npm run demo:smoke:brand
      - name: Auth and session lifecycle
        run: npm run demo:smoke:auth
      - name: Audit trail (append-only chain)
        run: npm run demo:smoke:audit
      - name: Trust surface (legal, brand, international)
        run: npm run demo:smoke:trust
      - name: Firestore seed (dry run)
        run: npm run firebase:seed -- --dry-run

      - name: Vector printable suite
        run: npm run demo:pdf
      - name: Reports-centre documents
        run: npm run demo:reports
      - name: Page-render smoke
        run: npm run demo:smoke
      - name: Production build
        run: npm run build

  firestore-teaching-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Teaching assignment validation
        run: npm run demo:smoke:teaching-assignments
      - name: Firestore emulator security tests
        shell: bash
        run: |
          set +e
          npx --yes firebase-tools@13.35.1 emulators:exec --project demo-shule-rules --only firestore "npm run test:rules:teaching" 2>&1 | tee /tmp/firestore-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 -c "from pathlib import Path; s=Path('/tmp/firestore-test.log').read_text(errors='replace')[-6000:]; print('::error title=Firestore emulator test failed::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
          fi
          exit "$status"
