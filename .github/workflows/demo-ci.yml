name: Demo CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Data-layer smoke
        run: npm run demo:smoke:data
      - name: O-level consistency
        run: npm run demo:smoke:olevel
      - name: Motion and reduced-motion
        run: npm run demo:smoke:motion
      - name: Landing content
        run: npm run demo:smoke:landing
      - name: Copy guard
        run: npm run demo:smoke:copy
      - name: Brand, theme and contrast
        run: npm run demo:smoke:brand
      - name: Firestore seed (dry run)
        run: npm run firebase:seed -- --dry-run

      - name: Vector printable suite
        run: npm run demo:pdf
      - name: Reports-centre documents
        run: npm run demo:reports
      - name: Page-render smoke
        run: npm run demo:smoke
      - name: Production build
        run: npm run build
